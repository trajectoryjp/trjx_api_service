syntax = "proto3";

package trajectory.trajectory_gcs_service.protocol.v1;
option go_package = "github.com/trajectoryjp/trjx_api_service/trajectory_gcs";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto"; 

import "github.com/trajectoryjp/trjx_api_service/trajectory_gcs_service/protocol/v1/resource.proto";
import "github.com/trajectoryjp/trjx_api_service/type/resource.proto";

import "protoc-gen-openapiv2/options/annotations.proto";

service MissionService {
    // CreateMission: ミッションの生成
    rpc CreateMission(CreateMissionRequest) returns (CreateMissionResponse) {}

    // AssignMissionWithMissionID: ミッションIDを指定してミッションを機体にアサインする
    rpc AssignMissionWithMissionID(AssignMissionWithMissionIDRequest) returns (AssignMissionWithMissionIDResponse){}

    // CreateMissionRecord: ミッションをデータベースに追加する
    rpc CreateMissionRecord(MissionRecord) returns (MissionID) {}

    // GetMissionRecord: ミッションの取得
    rpc GetMissionRecord(MissionID) returns (MissionRecord) {}

    // DeleteMission: ミッションの削除
    rpc DeleteMissionRecord(MissionID) returns (google.protobuf.Empty) {}

    // UpdateMission: ミッションの更新
    rpc UpdateMissionRecord(UpdateMissionRecordRequest) returns (MissionRecord) {}

    // ListMissionIDRecords: ミッションIDのリスト取得
    rpc ListMissionIDRecords(ListMissionIDRecordsRequest) returns (ListMissionIDRecordsResponse) {}

    // ListMissionRecords: ミッションレコードのリストを取得する
    rpc ListMissionRecords(ListMissionRecordsRequest) returns (ListMissionRecordsResponse) {}

    // SpceialMissionAttributeを持つMissionRecordを予約により派生させる(属性を変更した新規MissionRecordを作成する)
    // 派生時に必要な副作用が発生する(航路予約の作成など)
    // 内容は派生元と派生先の組み合わせに依存する
    // SpecialMissionRecordを持たないMissionRecordの予約(派生)はサポートしない(エラーとする)
    rpc ReserveSpecialMissionRecord(ReserveSpecialMissionRecordRequest) returns (ReserveSpecialMissionRecordResponse) {}

    // ミッションの表現形式を変換する(非推奨)
    rpc ConvertMissionFormat(ConvertMissionFormatRequest)returns (ConvertMissionFormatResponse){
        option deprecated = true;
    }

    // ConvertExternalMissionFormatToMission
    rpc ConvertExternalMissionFormatToMission(ConvertExternalMissionFormatToMissionRequest) returns (ConvertExternalMissionFormatToMissionResponse) {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            description: "外部形式ファイルをMissionへ変換する。"
            responses: {
                key: "400"
                value: {
                    description: "ファイルが壊れている / 対応範囲外 (gRPC: INVALID_ARGUMENT)\n"
                                 "- ERR_INVALID_KMZ: zip展開不可、template.kml欠落、XMLパース不能\n"
                                 "- ERR_UNSUPPORTED_TEMPLATE_TYPE: templateType != waypoint\n"
                                 "- ERR_UNSUPPORTED_HEIGHT_MODE: aboveGroundLevel / realTimeFollowSurface\n"
                                 "- ERR_UNSUPPORTED_FINISH_ACTION: finishAction = noAction(import時)\n"
                                 "- ERR_UNSUPPORTED_ALTITUDE_ATTR: フル生成時、MissionのAltitudeAttrがRELATIVE/AGL/未知の値\n"
                                 "- ERR_UNSUPPORTED_LAND_MODE: フル生成時、Landアイテムが存在するがModeが未知の値\n\n"
                                 "追加入力があれば成功しうる (gRPC: FAILED_PRECONDITION)\n"
                                 "- ERR_MISSING_REFERENCE_ALTITUDE: relativeToStartPointでtakeOffRefPointも外部入力もない"
                    schema: {
                        json_schema: {
                            ref: "#/definitions/rpcStatus"
                        }
                    }
                    examples: {
                        key: "application/json"
                        value: "{\n"
                               "  \"code\": 3,\n"
                               "  \"message\": \"ERR_INVALID_KMZ\",\n"
                               "  \"details\": []\n"
                               "}"
                    }
                }
            }
            responses: {
                key: "429"
                value: {
                    description: "入力サイズ・展開量の上限超過 (gRPC: RESOURCE_EXHAUSTED)\n"
                                 "- ERR_FILE_TOO_LARGE: 入力ファイルサイズが上限を超過\n"
                                 "- ERR_ZIP_TOO_LARGE: zip展開後バイト数が上限を超過\n"
                                 "- ERR_XML_TOO_DEEP: XMLのネスト深さが上限を超過"
                    schema: {
                        json_schema: {
                            ref: "#/definitions/rpcStatus"
                        }
                    }
                    examples: {
                        key: "application/json"
                        value: "{\n"
                               "  \"code\": 8,\n"
                               "  \"message\": \"ERR_FILE_TOO_LARGE\",\n"
                               "  \"details\": []\n"
                               "}"
                    }
                }
            }
            responses: {
                key: "500"
                value: {
                    description: "システムエラー (gRPC: INTERNAL)"
                    schema: {
                        json_schema: {
                            ref: "#/definitions/rpcStatus"
                        }
                    }
                    examples: {
                        key: "application/json"
                        value: "{\n"
                               "  \"code\": 13,\n"
                               "  \"message\": \"Internal server error\",\n"
                               "  \"details\": []\n"
                               "}"
                    }
                }
            }
        };
    }

