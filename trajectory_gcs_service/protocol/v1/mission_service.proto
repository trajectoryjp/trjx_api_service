message CreateMissionRequest { 
    ProjectID project_id = 7;
    TransactionID transaction_id = 2 ; // WideArea切替。未指定はWide。
    oneof Select {
        WithUAV create_with_property = 4 ; // 機体情報に基づいた時刻計算。ルート設計のみ（機体位置取得なし）
        WithUAV create_with_uav = 5; // 機体位置からのルート設計。機体への割付なし。
        WithUAV create_and_assign = 6; // 従来のCreateMissionAndAssign（機体割付）
        OnlyAssgin only_assign = 8; // ルート設計なし。機体割り付けのみ。ルートの安全性は保証されないことに注意（ローバー利用想定）。
    }
    message WithUAV {
        UAVID uav_id = 1;
        bool tie_straight = 13 ; // trueでWP優先（入力WPを真っ直ぐ結ぶ）。onlyAssignでは無効。
    }
    message OnlyAssgin {
        UAVID uav_id = 1;
    }
    optional ScheduledTime start_time = 10; //　onlyAssignでは無効。
    optional ScheduledTime arrival_time = 11; // 到着時間。onlyAssignでは無効。

    Mission mission = 12; // ルート計算を行うMissionItemのリスト。

    trajectory.trjx_api_service.Standard output_altitude = 14; // 出力高度属性。

    bool uses_public_channels_whenever_possible = 15; // パブリックな航路（UASL）を可能な限り使うか否か
    bool uses_private_channels_whenever_possible = 16; // プライベートな航路を可能な限り使うか否か

    bool has_maximum_altitude_limit = 17 ; // 上限高度を超えるルート設計を行うか否か
}

message CreateMissionResponse {
    MissionControllerResult result = 1; // 処理結果
    Mission mission = 2; // ルート計算を行った結果のミッションのリスト
    repeated string reserved_route_ids = 3 ; // 予約ID
}

message MissionRecord {
    Mission mission = 1; // MissionItemのリスト
    string name = 2; // 保存名
    ProjectID project_id = 3; // 所有組織
    TransactionID transaction_id = 4;
    UAVID uav_id = 5;
    ApplicationAttr app =6 ; // Saveを要求したアプリケーション。CreateMissionの応答を透過的にセーブする場合は設定しない。MissionのappIDに反映される
    optional Timestamps timestamps = 7; // ミッションの作成/更新日時　リクエスト時は設定しない
    // 下記の作成時に指定する追加項目(通常のレコード作成では不要)
    // - 策定済み航路の経路表現
    // - 航路を利用する経路
    // - 航路予約を表現するミッション
    // - 事前予約を表現するミッション
    optional SpecialMissionAttribute special_attribute = 8;
    MissionID mission_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY]; // リクエスト時の指定は無効。IDはサーバーで生成されます。
}

// 特殊なミッションを表現する追加プロパティ
message SpecialMissionAttribute {
    oneof mission_type {
        // 策定済み航路の経路表現
        AssignedUASLMission assigned_uasl_mission = 1;
        // 航路利用経路
        // このミッションは複数の航路の区間、または航路でない区間、もしくはその両方を含む。
        MissionUsingUASL mission_using_uasl = 2;
        // 航路予約済みミッション
        ReservedUASLMission reserved_uasl_mission = 3;
        // 事前予約済みミッション
        ReservedMission reserved_mission = 4;
    }
}

message AssignedUASLMission {
    // 策定済み航路ID
    string assigned_uasl_id = 1;
}

message MissionUsingUASL {
    // 利用する航路セクションID群
    repeated string uasl_section_ids = 1;
    // 利用している策定航路内経路レコードのIDリスト
    repeated MissionID assigned_uasl_mission_record_ids = 2;
}

message ReservedUASLMission {
    // 航路予約ID
    string uasl_reservation_id = 1;
    // 利用している策定済み航路ミッションレコードのIDリスト
    repeated MissionID assigned_uasl_mission_record_ids = 2;
    // 予約時間帯 開始時刻
    google.protobuf.Timestamp scheduled_start_time = 3;
    // 予約時間帯 終了時刻
    google.protobuf.Timestamp scheduled_end_time = 4;
}

message ReservedMission {
    // 本レコードで利用している航路に対応する予約航路内経路レコードのIDリスト
    repeated MissionID reserved_uasl_mission_record_ids = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // 元となる航路利用ミッションレコードのID
    MissionID mission_using_uasl_record_id = 5;
    // 機体情報(現在はID)
    UAVID uav_id = 2;
    // 予約時間帯 開始時刻
    google.protobuf.Timestamp scheduled_start_time = 3;
    // 予約時間帯 終了時刻
    google.protobuf.Timestamp scheduled_end_time = 4;
}

message AssignMissionWithMissionIDRequest {

    MissionID mission_id = 1; // MissionRecordのID(必須)
    bool save = 2 ; // trueでレスポンスの生成ミッションをDBSaveする。IDは新規作成(mission_idで指定されたIDには上書きしない)。

    ProjectID project_id = 7;

    oneof Select {
        WithUAV create_with_property = 4 ; // 機体情報に基づいた時刻計算。ルート設計のみ（機体位置取得なし）
        WithUAV create_with_uav = 5; // 機体位置からのルート設計。機体への割付なし。
        WithUAV create_and_assign = 6; // 従来のCreateMissionAndAssign（機体割付）
    }
    message WithUAV {
        UAVID uav_id = 1;
        bool tie_straight = 13 ; // trueでWP優先（入力WPを真っ直ぐ結ぶ）
    }
    message OnlyAssgin {
        UAVID uav_id = 1;
    }

    optional ScheduledTime start_time = 10;
    optional ScheduledTime arrival_time = 11; // 到着時間

    trajectory.trjx_api_service.Standard output_altitude = 14; // 出力高度属性。

    bool uses_public_channels_whenever_possible = 15; // パブリックな航路（UASL）を可能な限り使うか否か
    bool uses_private_channels_whenever_possible = 16; // プライベートな航路を可能な限り使うか否か

    bool has_maximum_altitude_limit = 17 ; // 上限高度を超えるルート設計を行うか否か
}

message AssignMissionWithMissionIDResponse {
    MissionControllerResult result = 1; // 処理結果
    Mission mission = 2; // ルート計算後のMission。createWithProperty以外ではターミナルルートも含む。
    optional MissionID mission_id = 3; // リクエストでsave=true時に保存された新規ミッションのID。save=false時は指定なし。
}


message UpdateMissionRecordRequest {
    MissionID mission_id = 1; // データベースレコードキー。必須
    MissionRecord mission_record = 2; // ミッションのデータベースレコード
}

message ListMissionIDRecordsRequest {
    ProjectID project_id = 1;  // 取得対象のプロジェクトID。未指定の場合は組織内全てのプロジェクトが対象
}

message ListMissionIDRecordsResponse {
    repeated MissionIDRecord mission_id_records = 1;  // ミッションIDのリスト。ミッションの情報はGetMissionRecordで取得する
}

message MissionIDRecord {
    MissionID mission_id = 1;
    string name = 2;
    Timestamps timestamps = 3; // ミッションの作成/更新日時
}

// MissionRecord一覧リクエスト
// 必須パラメータ以外は絞り込み(AND指定)要素として働く
message ListMissionRecordsRequest {
    // プロジェクトID ※自組織のプロジェクトのみ指定可
    // AND条件でフィルタリングされる。
    ProjectID project_id = 1;
    // レスポンスで返却するMissionRecordの最大件数
    int32 page_size = 2;
    // ページング指定値
    // 最初は空文字を指定し、前回のレスポンスで返却されたnext_page_tokenを指定する。
    string page_token = 3;
    // UAVID(完全一致)
    // AND条件でフィルタリングされる。
    optional UAVID uav_id = 4;
    // ミッション名(完全一致)
    // AND条件でフィルタリングされる。
    optional string name = 5;
    reserved 6 to 9;
    // 策定済み航路ミッションのプロパティ指定
    // OR条件でフィルタリングされる。
    optional AssignedUASLMissionQuery assigned_uasl_mission = 10;
    // 航路利用ミッションのプロパティ指定
    // OR条件でフィルタリングされる。
    optional MissionUsingUASLQuery mission_using_uasl = 11;
    // 航路予約済みミッションのプロパティ指定
    // OR条件でフィルタリングされる。
    optional ReservedUASLMissionQuery reserved_uasl_mission = 12;
    // 事前予約済みミッションのプロパティ指定
    // OR条件でフィルタリングされる。
    optional ReservedMissionQuery reserved_mission = 13;

    // 航路内経路検索条件
    // フィールド同士はAND条件
    // どのフィールドも指定しなかった場合はListMissionRecordsRequestトップレベルで指定された条件下でReservedMissionを持つMissionRecordをすべて検索する
    message AssignedUASLMissionQuery {
        // 策定済み航路ID
        optional string assigned_uasl_id = 1;
    }

    // 航路利用ミッション検索条件
    // フィールド同士はAND条件
    // どのフィールドも指定しなかった場合はListMissionRecordsRequestトップレベルで指定された条件下でReservedMissionを持つMissionRecordをすべて検索する
    message MissionUsingUASLQuery {
        // 該当レコードが利用する航路セクションID群
        // 指定したID列のいずれかを含むレコードを検索する(OR)
        repeated string uasl_section_ids = 1;
        // 利用している策定航路内経路レコードのIDリスト
        // 指定したID列のいずれかを含むレコードを検索する(OR)
        repeated MissionID assigned_uasl_mission_record_ids = 2;
    }

    // 予約航路内経路検索条件
    // フィールド同士はAND条件
    // どのフィールドも指定しなかった場合はListMissionRecordsRequestトップレベルで指定された条件下でReservedMissionを持つMissionRecordをすべて検索する
    message ReservedUASLMissionQuery {
        // 航路予約ID(完全一致)
        optional string uasl_reservation_id = 1;
        // 該当レコードが利用している策定航路内経路レコードのIDリスト
        // 指定したID列のいずれかを含むレコードを検索する(OR条件)
        repeated MissionID assigned_uasl_mission_record_ids = 2;
        // 同じ航路を利用する航路利用ミッションレコードのIDリスト
        // 指定したID列のいずれかを含むレコードを検索する(OR条件)
        repeated MissionID mission_using_uasl_record_ids = 3;
        // 同じ航路を利用する事前予約ミッションレコードのIDリスト
        // 指定したID列のいずれかを含むレコードを検索する(OR条件)
        repeated MissionID reserved_mission_record_ids = 4;
        // 予約時間帯 開始時刻
        // 指定した時刻以上のレコードを検索する(record >= scheduled_start_time)
        optional google.protobuf.Timestamp scheduled_start_time = 5;
        // 予約時間帯 終了時刻
        // 指定した時刻より前のレコードを検索する(record < scheduled_end_time)
        optional google.protobuf.Timestamp scheduled_end_time = 6;
    }

    // 事前予約ミッション検索条件
    // フィールド同士はAND条件
    // どのフィールドも指定しなかった場合はListMissionRecordsRequestトップレベルで指定された条件下でReservedMissionを持つMissionRecordをすべて検索する
    // ReservedMission.uav_idはトップレベルのuav_idで絞り込みされる
    message ReservedMissionQuery {
        // 該当レコードが利用している予約航路内経路レコードのIDリスト
        // 指定したID列のいずれかを含むレコードを検索する(OR条件)
        repeated MissionID reserved_uasl_mission_record_ids = 1;
        // 予約時間帯 開始時刻
        optional google.protobuf.Timestamp scheduled_start_time = 2;
        // 予約時間帯 終了時刻
        optional google.protobuf.Timestamp scheduled_end_time = 3;
    }
}

message ListMissionRecordsResponse {
    repeated MissionRecord mission_records = 1; // ミッションレコード
    string next_page_token = 2; // 分割取得の際の2回目以降のリクエスト時に指定が必要
}

message ReserveSpecialMissionRecordRequest {
    // 派生元のMissionRecordのID
    // 指定したMissionRecordが存在しない場合エラーとなる
    MissionID source_mission_record_id = 1;
    // 派生先のSpecialMissionAttributeの指定
    // 派生元と派生先の組み合わせは、下記の条件を満たす必要がある(満たさない場合はエラー)
    // - 派生元MissionRecord IDのMissionRecordのspecial_attribute(S)と本メッセージ内ののspecial_attribute(D)が下記の組み合わせであること
    //   1. (S)MissionUsingUASL - (D)ReservedUASLMission
    //   2. (S)MissionUsingUASL - (D)ReservedMission
    //
    // それぞれの組み合わせにおける副作用は下記
    // - 1の組み合わせを指定した場合: 航路システムへ航路予約が行われる
    // - 2の組み合わせを指定した場合: ミッション予約が行われる(時刻記録のみであり、空間予約はTBD)
    // 副作用の実行に失敗した場合はエラーとなり、派生先MissionRecordは作成されない
    MissionReservationAttribute destination_attribute = 2;
}

// 予約属性判別用のフィールド
message MissionReservationAttribute {
    oneof mission_type {
        // 航路予約
        ReservedUASLMission reserved_uasl_mission = 1;
        // ミッション予約
        ReservedMission reserved_mission = 2;
    }
}

// ReserveSpecialMissionRecord　レスポンス
message ReserveSpecialMissionRecordResponse {
    MissionDatabaseResult result = 1;
    // 予約(派生)されて新規作成されたMissionRecord
    MissionRecord mission_record = 2;
}

// MissionDatabaseの処理結果の基本形
message MissionDatabaseResult {
    enum Status {
        STATUS_UNSPECIFIED = 0; 
        STATUS_CONTINUE = 5; // 継続　（streamの場合のみ）
        STATUS_END = 1;        // 終了　（streamの場合のみ）
        STATUS_COMPLETE = 2;   // 完了
        STATUS_ERROR = 3;
        STATUS_INVALID_UAV = 4; // 無効なUAVID DEPRICATED
        STATUS_INTERNAL_ERROR = 9;
        STATUS_ERROR_PARAMETER = 11; // UAVコマンドエラー
        STATUS_ERROR_UN_STABLE = 13; // 飛行可能状態でない
        STATUS_ERROR_EMPTY_MISSION = 14; // 指定したミッションが空
        STATUS_ERROR_FC_BUSY = 15; // FCがビジー 
        STATUS_ERROR_FLIGHT_PATH_STRATA_CONFIG = 51; 
        STATUS_ERROR_FLIGHT_PATH_NOT_FOUND_AREA = 52; 
        STATUS_ERROR_FLIGHT_PATH_NOT_FOUND_MODEL = 53; 
        STATUS_ERROR_FLIGHT_PATH_OUT_OF_AREA = 54; 
        STATUS_ERROR_FLIGHT_PATH_ILLIGAL_POSITION = 55; 
        STATUS_ERROR_COMMUNICATION_FC = 60; // FCとの通信エラー。Timeout含む。
        STATUS_ERROR_FLIGHT_PATH_UNKNOWN = 50;
    }
    Status status = 1; // 処理結果
    string detail = 2; // 詳細情報
    Timestamps timestamps = 8; // ミッションの作成/更新日時
}


// ミッションの作成/更新日時
message Timestamps {
    // 作成日時
    google.protobuf.Timestamp create_time = 1;
    // 更新日時
    google.protobuf.Timestamp update_time = 2;
}


message ConvertMissionFormatRequest {
    Mission mission =1;
    string uav_id = 2;

    oneof selectOutput {
        LitchiFormatSt litchiFormat = 4 ; // 出力は相対高度 Litchi形式の場合は、高度はMSLまたは楕円球体高を指定すること。機首方向パラメータは未サポート。
        MavlinkFormatSt mavlinkFormat = 5 ;
    }

    message LitchiFormatSt {
        // MissionはAGL不可
        oneof baseAltitude {
            int32 missionItemNumber = 1 ; // 指定したWPの位置を基準（itemsArrayのインデックス値（優先）であってWPでなければエラー、itemsのキー（非優先）でDEPRECATED）
            AltitudeSt altitude = 2 ; // 基準高度
            DifferentialPointSt differentialPoint = 3 ; // 指定WPのAGLを指定する。MissionItemはAGL不可。
        }
    }

    message MavlinkFormatSt {
        /*
          0:Ellipsoid
          1:Relative
          2:AGL
          3:MSL
        */
        uint32 outputAltitude = 1 ;
        oneof baseAltitude { // outputAltitudeがRelative の場合のみ有効
            int32 missionItemNumber = 2 ; // 指定したWPの位置を基準
            AltitudeSt altitude = 3 ; // 基準高度
            DifferentialPointSt differentialPoint = 4 ; // 指定WPのAGLを指定する。MissionItemはAGL不可。
        }
    }


    message AltitudeSt {
        /*
          0:Ellipsoid
          1:Relative
          2:AGL
          3:MSL
        */
        uint32 attr = 1 ;
        float altitude = 2 ;
    }

    message DifferentialPointSt {
        int32 missionItemNumber = 1 ; // 指定したWPの位置を基準（itemsArrayのインデックス値（優先）であってWPでなければエラー、itemsのキー（非優先）でDEPRECATED）
        float agl = 2 ; // missionItemNumberで指定したWPの地上高
    }
}

message ConvertMissionFormatResponse {
    bool result = 1 ;
    string status = 2 ;
    /*
      0:TrjxFormat,
      1:LitchiFormat,
      2:MavlinkFormat,
    */
    uint32 attr = 3 ;
    oneof MissionFormat { // output file format
        Mission Trjx = 4 ;
        string Csv = 5 ;
        string JsonMission = 6 ; // .mission拡張子(mavlink)
    }
}

