message ConversionNotice {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        json_schema: {
            description: "要素単位の通知(変換自体は成功)\n"
                         "集約せず要素ごとに1件返すため、同じ要素名の通知が並ぶことがある"
        }
    };

    enum Level {
        LEVEL_UNSPECIFIED = 0;
        // 情報は失われていない(importでは元ファイルに保持される)
        LEVEL_INFO = 1;
        // 情報が失われた、または渡した入力が使われなかった
        LEVEL_WARNING = 2;
    }

    message ElementSkipped {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
            json_schema: { description: "変換先のない要素をスキップした" }
        };

        string element = 1 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "要素名"
            }
        ];
        string value = 2 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "値"
            }
        ];
        oneof position {
            int32 index = 3 [
                (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                    description: "順序による指定(例: 元ファイル上のWP番号) ※要素の位置。位置を特定できない要素では設定しない"
                }
            ];
            string tag = 4 [
                (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                    description: "識別子による指定(例: MissionItem.tag) ※要素の位置。位置を特定できない要素では設定しない"
                }
            ];
        }
    }

    message ReferenceAltitudeInputIgnored {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
            json_schema: { description: "外部入力の基準高度が元ファイルからの導出値と異なるため無視した" }
        };

        float derived = 1 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "元ファイルからの導出値(MSL,単位m)"
            }
        ];
        float input = 2 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "無視した入力値(MSL,単位m)"
            }
        ];
    }

    message FinishActionDefaulted {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
            json_schema: { description: "Landアイテムが無くfinishActionを既定値にした通知 ※適用値はnoActionに確定するためフィールドを持たない" }
        };
    }

    message ResourceDropped {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
            json_schema: { description: "保存用のファイルの生成時にエントリを除去した" }
        };

        string entry = 1 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "除去したエントリ名"
            }
        ];
    }

    message DjiWpmlOptionsDefaulted {
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
            json_schema: { description: "DjiWpmlExportOptionsのうち、指定が無く既定値を使ったものがある" }
        };

        DjiWpmlExportOptions applied = 1 [
            (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
                description: "既定値で補ったフィールドだけを設定"
            }
        ];
    }

    Level level = 1 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "通知レベル（種別からは一意に決まらず要素ごとに定まる）"
        }
    ];

    oneof detail {
        ElementSkipped element_skipped = 2;
        ReferenceAltitudeInputIgnored reference_altitude_input_ignored = 3;
        FinishActionDefaulted finish_action_defaulted = 4;
        ResourceDropped resource_dropped = 5;
        DjiWpmlOptionsDefaulted dji_wpml_options_defaulted = 6;
    }
}



/*
　　ミッションのフォーマット
*/
enum ExternalMissionFormat {
    EXTERNAL_MISSION_FORMAT_UNSPECIFIED = 0;
    EXTERNAL_MISSION_FORMAT_DJI_WPML = 1;
    EXTERNAL_MISSION_FORMAT_MAVLINK_JSON = 2;
    EXTERNAL_MISSION_FORMAT_LITCHI_CSV = 3;
}


message DjiWpmlExportOptions {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        json_schema: {
            description: "DJI WPMLのexportで指定する、Missionが持たない値\n"
                         "未指定のフィールドは既定値になり、その旨がDjiWpmlOptionsDefaultedで通知される\n"
                         "DJI WPML仕様(下記リンク)で定義されている値をそのまま入力する\n"
                         "https://github.com/dji-sdk/Cloud-API-Doc/blob/4ec6b0c7f9472aeb09a0a47949855d19c473ea07/docs/en/60.api-reference/00.dji-wpml/40.common-element.md"
        }
    };

    optional int32 drone_enum_value = 1 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "機体型式の値。既定値は60(M300 RTK)",
            default: "60"
        }
    ];

    optional int32 drone_sub_enum_value = 2 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "機体型式の派生種別。一部型式では指定必須(仕様参照)。既定値なし"
        }
    ];

    optional int32 payload_enum_value = 3 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "ペイロード型式の値。既定値は43(H20T)",
            default: "43"
        }
    ];

    optional int32 payload_position_index = 4 [
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "ペイロードの搭載位置(0=左側/1=右側/2=上部)。既定値は0",
            default: "0"
        }
    ];
}