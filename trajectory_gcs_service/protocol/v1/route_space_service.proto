syntax = "proto3";

package trajectory.trajectory_gcs_service.protocol.v1;
option go_package = "github.com/trajectoryjp/trjx_api_service/trajectory_gcs";

import "google/protobuf/empty.proto";

import "github.com/trajectoryjp/trjx_api_service/type/resource.proto";
import "github.com/trajectoryjp/trjx_api_service/uas/generic/v2/sdsp_g.proto";

service RouteSpaceService {
    rpc EstimateRouteSpace(EstimateRouteSpaceRequest) returns (EstimateRouteSpaceResponse);
    rpc CreateRouteSpace(CreateRouteSpaceRequest) returns (RouteSpace);
    rpc DeleteRouteSpace(DeleteRouteSpaceRequest) returns (google.protobuf.Empty);
    rpc ListRouteSpaces(ListRouteSpacesRequest) returns (ListRouteSpacesResponse);

// 2026年度末が期日である航路予約と航路アセスメントで使用するためのrpcです
// rpc EvaluateMission(EvaluateMissionRequest) returns (EvaluateMissionResponse);
}

// ==========================================
// 1. 共通・基礎データ型
// ==========================================

// 3D面データ（上下左右の壁面などの描画用）
message PolygonFace {
  repeated trajectory.trjx_api_service.Position vertices = 1;
}

// ワイヤーフレーム用の線データ
message WireframeEdge {
  repeated trajectory.trjx_api_service.Position path = 1;
}

// 軌跡計算モード
enum CalculationMode {
  CALCULATION_MODE_UNSPECIFIED = 0;
  CALCULATION_MODE_KINEMATIC = 1; // 滑らかな曲線（アウトインアウト等）
  CALCULATION_MODE_LEGACY = 2; // 従来方式（直線交点）
}

// ==========================================
// 2. 空間・スロット構成定義 (Requestの要素)
// ==========================================

// 方式1: 均一グリッド方式 (列数 × 行数)
message GridUniformSpace {
  double slot_width = 1; // スロット1つあたりの幅(m)
  double slot_height = 2; // スロット1つあたりの高さ(m)
  int32 columns = 3; // 横列数
  int32 rows = 4; // 縦行数（高度層数）
}

// カスタムスタック方式における各スロットのグリッドインデックス
message SlotIndex {
  int32 column_index = 1; // 0始まりの横列番号
  int32 row_index = 2; // 0始まりの高さ層番号
}

// 方式2: カスタムスタック方式 (セル位置指定で台形等も表現)
message CustomStackSpace {
  double slot_width = 1; // スロット1つあたりの幅(m)
  double slot_height = 2; // スロット1つあたりの高さ(m)
  int32 max_columns = 3; // 全体の最大列数（バウンディング幅）
  int32 max_rows = 4; // 全体の最大行数（バウンディング高さ）
  repeated SlotIndex active_slots = 5; // 有効化するスロットのインデックス群
}

// 空間構造仕様（Grid か Custom のいずれかを指定）
message RouteSpaceSpecification {
  oneof definition {
    GridUniformSpace grid_uniform = 1;
    CustomStackSpace custom_stack = 2;
  }
}

// 機体および運行の前提パラメータ
message VehicleConfig {
  VehicleCategory vehicle_category = 1; // 航空機カテゴリ
  CalculationMode calculation_mode = 2; // 軌跡計算モード
}

enum VehicleCategory {
  VEHICLE_CATEGORY_UNSPECIFIED = 0;
  VEHICLE_CATEGORY_MULTICOPTER = 1;
  VEHICLE_CATEGORY_VTOL = 2;
}

// ==========================================
// 3. 評価結果・形状データ (Responseの要素)
// ==========================================
// 飛行経路計画可能空間 https://www.nedo.go.jp/content/800055331.pdf
message RouteSpace {
  string id = 1;
  string name = 2;
  repeated trajectory.trjx_api_service.Position kinematic_path = 3; // 機体性能をもとに計算された滑らかな中心軌跡
  repeated PolygonFace space_faces = 4; // 空間トンネルの面ポリゴン (Deck.gl 描画用)
  repeated WireframeEdge space_edges = 5; // 空間トンネルの枠線ワイヤーフレーム
  repeated trajectory.trjx_api_service.Position fall_footprint_2d = 6; // 地表投影された2Dの落下予想範囲

    // 取得内容
    enum View {
        // 非指定
        VIEW_UNSPECIFIED = 0;

        // IDと名前のみ
        VIEW_BASIC = 1;

        // 全て
        VIEW_FULL = 2;
    }
}

// ==========================================
// 4. API リクエスト / レスポンス
// ==========================================

message EstimateRouteSpaceRequest {
  repeated trajectory.trjx_api_service.Position center_line = 1; // ユーザーが引いた中心線
  RouteSpaceSpecification space_specification = 2; // 経路空間のスロット定義
  VehicleConfig vehicle_config = 3; // 機体・運行設定
  repeated trajectory.trjx_api_service.HorizontalPosition max_fall_range = 4; // ユーザー設定の最大落下範囲 (2D)
}

message EstimateRouteSpaceResponse {
  RouteSpace route_space = 1; // 描画用の立体・経路データ

// 逸脱エラーの原因となった軌跡の箇所
// 逸脱エラーがない場合は空です
  repeated int32 exceeding_fall_range_error_segments = 2; // TODO: edge_indexにする

    // グランドリスクと衝突していて警告を出している軌跡の箇所
    // エラーの際は空です
  repeated int32 collisions_ground_risk_warning_segments = 3; // TODO: edge_indexにする
}

// ==========================================
// 5. 永続化 ＆ ミッション評価用メッセージ (新規追加)
// ==========================================
message CreateRouteSpaceRequest {
  RouteSpace route_space = 1; // 描画用の立体・経路データ
}

message DeleteRouteSpaceRequest {
  string route_space_id = 1;
}

message ListRouteSpacesRequest {
    // 取得するオブジェクトの最大数
    int32 page_size = 1;

    // 取得内容
    RouteSpace.View view = 2;

    // 取得範囲。ボックスに衝突する飛行経路計画可能空間を返します。nilの場合は全て返します
    optional trajectory.trjx_api_service.BoundingBox box = 3;

    // ページトークン。前回のリクエストで返された次のページを取得するために使用します。初回のリクエストの場合は空です
    string page_token = 4;
}

message ListRouteSpacesResponse {
    repeated RouteSpace route_spaces = 1;

    // 次のページトークン。次のページがない場合は空です
    string next_page_token = 2;
}

