syntax = "proto3";

package trajectory.trajectory_gcs_service.protocol.v1;
option go_package = "github.com/trajectoryjp/trjx_api_service/trajectory_gcs";
import "protoc-gen-openapiv2/options/annotations.proto";

service OrganizationService {
  // 組織情報を取得する
  // cesium_access_token, default_cesium_access_tokenは返す
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse){
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "組織情報を取得する";
      description:"組織情報を取得する。\n\n"
                  "cesium_access_token, default_cesium_access_tokenは返す。\n"
                  "エラーレスポンスの`details`には、以下のエラーコードが含まれる可能性がある。\n"
                  "エラーコードの詳細は https://trjxdoc.trajectory.jp/BEGatewaySpesification/error_codes.html を参照。\n\n"
                  "- `4009`\n"
                  "- `5039`";
      parameters: {
        headers: {
          name: "user_id"
          type: STRING
          description: "ユーザID"
          required: true
        }
        headers: {
          name: "Authorization"
          type: STRING
          description: "Bearer Token"
          required: true
        }
      }
      responses: {
      key: "400";
      value: {
        description: "Invalid request.";
        schema: {
          json_schema: {
            ref: "#/definitions/rpcStatus";
            }
          };
        examples: {
          key: "application/json";
          value: "{\n"
              "  \"code\": 3,\n"
              "  \"message\": \"uavId is empty\",\n"
              "  \"details\": [\n"
              "    {\n"
              "      \"@type\": \"type.googleapis.com/trajectory.trajectory_gcs_service.protocol.v1.ErrorCode\",\n"
              "      \"errorCode\": 4001\n"
              "    }\n"
              "  ]\n"
              "}";
        }
      }
    }
  };
  }
  
  // cesium_access_tokenを取得する
  rpc GetCesiumToken(GetCesiumTokenRequest) returns (GetCesiumTokenResponse){
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "cesium_access_tokenを取得する";
      description: "cesium_access_tokenを取得する。\n\n"
                  "エラーレスポンスの`details`には、以下のエラーコードが含まれる可能性がある。\n"
                  "エラーコードの詳細は https://trjxdoc.trajectory.jp/BEGatewaySpesification/error_codes.html を参照。\n\n"
                  "- `4009`\n"
                  "- `5000`\n"
                  "- `5039`";
      parameters: {
        headers: {
          name: "user_id"
          type: STRING
          description: "ユーザID"
          required: true
        }
        headers: {
          name: "Authorization"
          type: STRING
          description: "Bearer Token"
          required: true
        }
      }
      responses: {
      key: "400";
      value: {
        description: "Invalid request.";
        schema: {
          json_schema: {
            ref: "#/definitions/rpcStatus";
          }
        };
        examples: {
          key: "application/json";
          value: "{\n"
              "  \"code\": 3,\n"
              "  \"message\": \"uavId is empty\",\n"
              "  \"details\": [\n"
              "    {\n"
              "      \"@type\": \"type.googleapis.com/trajectory.trajectory_gcs_service.protocol.v1.ErrorCode\",\n"
              "      \"errorCode\": 4001\n"
              "    }\n"
              "  ]\n"
              "}";
        }
      }
    }
  };
  }

  // cesium_access_tokenを設定する
  rpc SetCesiumToken(SetCesiumTokenRequest) returns (SetCesiumTokenResponse){
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "cesium_access_tokenを設定する";
      description: "cesium_access_tokenを設定する。\n\n"
                  "エラーレスポンスの`details`には、以下のエラーコードが含まれる可能性がある。\n"
                  "エラーコードの詳細は https://trjxdoc.trajectory.jp/BEGatewaySpesification/error_codes.html を参照。\n\n"
                  "- `4003`\n"
                  "- `4009`\n"
                  "- `5019`\n"
                  "- `5039`";
      parameters: {
        headers: {
          name: "user_id"
          type: STRING
          description: "ユーザID"
          required: true
        }
        headers: {
          name: "Authorization"
          type: STRING
          description: "Bearer Token"
          required: true
        }
      }
      responses: {
      key: "400";
      value: {
        description: "Invalid request.";
        schema: {
          json_schema: {
            ref: "#/definitions/rpcStatus";
          }
        };
        examples: {
          key: "application/json";
          value: "{\n"
              "  \"code\": 3,\n"
              "  \"message\": \"uavId is empty\",\n"
              "  \"details\": [\n"
              "    {\n"
              "      \"@type\": \"type.googleapis.com/trajectory.trajectory_gcs_service.protocol.v1.ErrorCode\",\n"
              "      \"errorCode\": 4001\n"
              "    }\n"
              "  ]\n"
              "}";
        }
      }
    }
  };
  }

  rpc GetDjiFlightHubToken(GetDjiFlightHubTokenRequest) returns (GetDjiFlightHubTokenInfoResponse){
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetDjiFlightHubToken:DJIFlightHubTokenを取得する";
      description: "DJIFlightHubTokenを取得する。\n\nadminのみ実行可能。";
      responses: {
        key: "401";
        value: {
          description: "Unauthenticated";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
      responses: {
        key: "403";
        value: {
          description: "Permission Denied (権限エラー adminのみ実行可能)";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
      responses: {
        key: "500";
        value: {
          description: "Internal Server Error";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
    };
  }

  rpc UpdateDjiFlightHubToken(UpdateDjiFlightHubTokenRequest) returns (UpdateDjiFlightHubTokenResponse){
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "UpdateDjiFlightHubToken:DJIFlightHubTokenを更新する";
      description: "DJIFlightHubTokenを更新する。\n\n"
                  "adminのみ実行可能。\n"
                  "※Tokenの有効性の判断は実施しないため、有効性判定後に実施する必要あり。";
      responses: {
        key: "401";
        value: {
          description: "Unauthenticated";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
      responses: {
        key: "403";
        value: {
          description: "Permission Denied (権限エラー adminのみ実行可能)";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
      responses: {
        key: "500";
        value: {
          description: "Internal Server Error";
          schema: {
            json_schema: {
              ref: "#/definitions/rpcStatus";
            }
          };
        }
      }
    };
  }
}

// GetOrganizationのリクエスト
message GetOrganizationRequest {
}

// GetOrganizationのレスポンス
message GetOrganizationResponse {
  // 組織ID
  string id = 1;
  // セシウムアクセストークン
  string cesium_access_token = 2;
  // デフォルトのセシウムアクセストークン
  // このパラメータはデフォルトのセシウムアクセストークンとして登録されます。
  // cesium_access_tokenを登録しない場合、デフォルトのセシウムアクセストークンが使用されます。
  // ただし、この時点ではTRJX-UIに2DMapのみが表示されます。
  // 3DMapを表示するには、SetCesiumToken RPC でcesium_access_tokenを登録する必要があります。
  string default_cesium_access_token = 3;

  // DJIFlightHubTokenが設定されているか true: 値が設定されている / false:値が設定されていない(空である)
  bool is_dji_flight_hub_token_set = 4;
}

// GetCesiumTokenのリクエスト
message GetCesiumTokenRequest {
}

// GetCesiumTokenのレスポンス
message GetCesiumTokenResponse {
  // セシウムアクセストークン
  string cesium_access_token = 1;
}

// SetCesiumTokenのリクエスト
message SetCesiumTokenRequest {
  // セシウムアクセストークン
  string cesium_access_token = 1;
}

// SetCesiumTokenのレスポンス
message SetCesiumTokenResponse {
  // ステータス
  string status = 1 [deprecated=true]; // 「ok」のみを返すため、非推奨です

}

message UpdateDjiFlightHubTokenRequest{
  string token = 1; // DjiFlightHubToken
}

message UpdateDjiFlightHubTokenResponse{
}

message GetDjiFlightHubTokenRequest{
}

message GetDjiFlightHubTokenInfoResponse{
  string token = 1; // DjiFlightHubToken
}