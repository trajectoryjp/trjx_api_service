syntax = "proto3";

package trajectory.trajectory_gcs_service.protocol.v1;
option go_package = "github.com/trajectoryjp/trjx_api_service/trajectory_gcs";

import "google/protobuf/empty.proto";

import "github.com/trajectoryjp/trjx_api_service/type/resource.proto";
import "github.com/trajectoryjp/trjx_api_service/uas/generic/v2/sdsp_g.proto";

service UaslService {
    rpc EstimateRouteSpace(EstimateRouteSpaceRequest) returns (EstimateRouteSpaceResponse); // TODO: 飛行経路計画可能空間の英語名は何ですか？ ValueChannelは実装済みですか？
    rpc CreateRouteSpace(CreateRouteSpaceRequest) returns (RouteSpace);
    rpc DeleteRouteSpace(DeleteRouteSpaceRequest) returns (google.protobuf.Empty);
    rpc ListRouteSpaces(ListRouteSpacesRequest) returns (ListRouteSpacesResponse);

    // UI 表示範囲内の航路ピクセルを取得する (2D 向け)
    rpc ListUaslPixels(ListUaslPixelsRequest) returns (ListUaslPixelsResponse);
    // UI 表示範囲内の航路ボクセルを取得する (3D 向け)
    rpc ListUaslVoxels(ListUaslVoxelsRequest) returns (ListUaslVoxelsResponse);
}

// 航路ピクセル取得リクエスト
message ListUaslPixelsRequest {
    // 取得する航路ピクセルの最大数 (初期値 = 0)。0 の場合はサーバー側の設定値が代入されます。
    int32 page_size = 1;
    // 前回のリクエストで返されたページトークン。初回は指定しない。
    string page_token = 2;
    // View の範囲
    trajectory.trjx_api_service.BoundingBox bounding_box = 3;
}

// 航路ピクセル取得レスポンス
message ListUaslPixelsResponse {
    // 次の項目へのページトークン。全て読み切った場合は "" が返る。
    string next_page_token = 1;
    // 航路
    repeated PixelBasedUasl uasls = 2;
}

// 航路ボクセル取得リクエスト
message ListUaslVoxelsRequest {
    // 取得する航路ボクセルの最大数 (初期値 = 0)。0 の場合はサーバー側の設定値が代入されます。
    int32 page_size = 1;
    // 前回のリクエストで返されたページトークン。初回は指定しない。
    string page_token = 2;
    // View の範囲
    trajectory.trjx_api_service.BoundingBox bounding_box = 3;
}

// 航路ボクセル取得レスポンス
message ListUaslVoxelsResponse {
    // 次の項目へのページトークン。全て読み切った場合は "" が返る。
    string next_page_token = 1;
    // 航路
    repeated VoxelBasedUasl uasls = 2;
}

// ピクセル表現の航路
message PixelBasedUasl {
    // 航路セクション
    UaslSection uasl_section = 1;
    // 航路ピクセルのリスト
    repeated UaslPixel uasl_pixels = 2;
}

// 航路 ID
message UaslSection {
    // オブジェクト ID (セクションごとに一意)
    int64 object_id = 1;
    // 名前
    string name = 2;
    // 航路 ID
    string uasl_id = 3;
    // 航路名
    string uasl_name = 4;
    // オブジェクトの表示範囲
    UaslVisibility visibility = 5;

    // 表示範囲の種別
    enum UaslVisibility {
        // 未指定
        UNSPECIFIED = 0;
        // 公開
        PUBLIC = 1;
        // プライベート
        PRIVATE = 2;
    }
}

// 航路ピクセル
message UaslPixel {
    // 空間 ID (2D; z/x/y)
    generic.v2.SpatialIdentification spatial_2d_id = 1;
}

// 航路ボクセル
message UaslVoxel {
    // 空間 ID
    generic.v2.SpatialIdentification spatial_id = 1;
}

// ボクセル表現の航路
message VoxelBasedUasl {
    // 航路セクション
    UaslSection uasl_section = 1;
    // 航路ボクセルのリスト
    repeated UaslVoxel uasl_voxels = 2;
}


// rpc EvaluateMission(EvaluateMissionRequest) returns (EvaluateMissionResponse); // TODO: 既存のものにありませんか？

// ==========================================
// 1. 共通・基礎データ型
// ==========================================

// 3D面データ（上下左右の壁面などの描画用）
message PolygonFace {
  repeated trajectory.trjx_api_service.Position vertices = 1;
}

// ワイヤーフレーム用の線データ
message WireframeEdge {
  repeated trajectory.trjx_api_service.Position path = 1;
}

// 軌跡計算モード
enum CalculationMode {
  CALCULATION_MODE_UNSPECIFIED = 0;
  CALCULATION_MODE_KINEMATIC = 1; // 滑らかな曲線（アウトインアウト等）
  CALCULATION_MODE_LEGACY = 2; // 従来方式（直線交点）
}

// ==========================================
// 2. 空間・スロット構成定義 (Requestの要素)
// ==========================================

// 方式1: 均一グリッド方式 (列数 × 行数)
message GridUniformSpace {
  double slot_width = 1; // スロット1つあたりの幅(m)
  double slot_height = 2; // スロット1つあたりの高さ(m)
  sint32 columns = 3; // 横列数
  sint32 rows = 4; // 縦行数（高度層数）
}

// カスタムスタック方式における各スロットのグリッドインデックス
message SlotIndex {
  sint32 column_index = 1; // 0始まりの横列番号
  sint32 row_index = 2; // 0始まりの高さ層番号
}

// 方式2: カスタムスタック方式 (セル位置指定で台形等も表現)
message CustomStackSpace {
  double slot_width = 1; // スロット1つあたりの幅(m)
  double slot_height = 2; // スロット1つあたりの高さ(m)
  sint32 max_columns = 3; // 全体の最大列数（バウンディング幅）
  sint32 max_rows = 4; // 全体の最大行数（バウンディング高さ）
  repeated SlotIndex active_slots = 5; // 有効化するスロットのインデックス群
}

// 空間構造仕様（Grid か Custom のいずれかを指定）
message RouteSpaceSpecification {
  oneof definition {
    GridUniformSpace grid_uniform = 1;
    CustomStackSpace custom_stack = 2;
  }
}

// 機体および運行の前提パラメータ
message VehicleConfig {
  string vehicle_type = 1; // "multicopter" または "vtol"
  double cruise_speed_kmh = 2; // 巡航速度 (km/h)
  double max_bank_angle_deg = 3; // 最大バンク角 (度)
  CalculationMode calculation_mode = 4; // 軌跡計算モード
}

// ==========================================
// 3. 評価結果・形状データ (Responseの要素)
// ==========================================

message RouteSpace {
  string id = 1;
  string name = 2;
  repeated trajectory.trjx_api_service.Position kinematic_path = 3; // 機体性能をもとに計算された滑らかな中心軌跡
  repeated PolygonFace space_faces = 4; // 空間トンネルの面ポリゴン (Deck.gl 描画用)
  repeated WireframeEdge space_edges = 5; // 空間トンネルの枠線ワイヤーフレーム
  repeated trajectory.trjx_api_service.Position fall_footprint_2d = 6; // 地表投影された2Dの落下予想範囲

    // 取得内容
    enum View {
        // 非指定
        VIEW_UNSPECIFIED = 0;

        // 地形ピクセルデータ、障害物データ、一時障害物データ、エアーリスクデータ、グランドリスクデータ、
        // 航路ボクセルデータ、気象ボクセルデータ、電波ボクセルデータの他
        VIEW_BASIC = 1;

        // 全て
        VIEW_FULL = 2;
    }
}

// はみ出し判定およびアセスメント評価結果
message AssessmentResult {
  bool is_exceeding_fall_range = 1; // max_fall_polygon から逸脱しているか
  repeated trajectory.trjx_api_service.Position error_segments = 2; // 逸脱の原因となった軌跡の箇所
  double suggested_speed_kmh = 3; // 逸脱回避のための提案巡航速度
}

// ==========================================
// 4. API リクエスト / レスポンス
// ==========================================

message EstimateRouteSpaceRequest {
  repeated trajectory.trjx_api_service.Position center_line = 1; // ユーザーが引いた中心線
  RouteSpaceSpecification space_specification = 2; // 経路空間のスロット定義
  VehicleConfig vehicle_config = 3; // 機体・運行設定
  repeated trajectory.trjx_api_service.Position max_fall_range = 4; // ユーザー設定の最大落下範囲 (2D)
}

message EstimateRouteSpaceResponse {
  RouteSpace route_space = 1; // 描画用の立体・経路データ
  AssessmentResult assessment_result = 2; // 包含・アセスメント判定結果
}

// ==========================================
// 5. 永続化 ＆ ミッション評価用メッセージ (新規追加)
// ==========================================
message CreateRouteSpaceRequest {
  RouteSpace route_space = 1; // 描画用の立体・経路データ
}

message DeleteRouteSpaceRequest {
  string route_space_id = 1;
}

message ListRouteSpacesRequest {
    // 取得するオブジェクトの最大数
    sint32 page_size = 1;

    // 取得内容
    RouteSpace.View view = 2;

    // 取得範囲。ボックスに衝突する飛行経路計画可能空間を全て返します // TODO: 直感的には空間IDで指定すべきだと思うが需要はありますか？
    trajectory.trjx_api_service.BoundingBox box = 3;

    // ページトークン。前回のリクエストで返された次のページを取得するために使用します。初回のリクエストの場合は空です
    string page_token = 4;
}

message ListRouteSpacesResponse {
    repeated RouteSpace route_spaces = 1;

    // 次のページトークン。次のページがない場合は空です
    string next_page_token = 2;
}

message EvaluateMissionRequest {
  repeated string space_ids = 1; // 通過・利用する RouteSpace の ID 群
  repeated trajectory.trjx_api_service.Position waypoints = 2; // 実機の飛行 WP
  string vehicle_type = 3; // "multicopter" または "vtol"
  string max_fall_id = 4; // 対象とする MaxFallRange の ID
}

message EvaluateMissionResponse {
  bool is_path_inside_spaces = 1; // 飛行軌跡が選択空間群の内部に収まっているか
  bool is_fall_inside_range = 2; // 落下予想範囲が MaxFallRange 内に収まっているか
  repeated trajectory.trjx_api_service.Position kinematic_path = 3; // 描画用の運動学飛行軌跡
  repeated trajectory.trjx_api_service.Position fall_footprint_2d = 4; // 描画用の 2D 落下予想範囲
}
