syntax = "proto3";

package trajectory.trajectory_gcs_service.protocol.v1;
option go_package = "github.com/trajectoryjp/trjx_api_service/trajectory_gcs";

service UaslService {
    // UI 表示範囲内の航路ピクセルを取得する (2D 向け)
    rpc ListUaslPixelsInView(ListUaslPixelsInViewRequest) returns (ListUaslPixelsInViewResponse);
    // UI 表示範囲内の航路ボクセルを取得する (3D 向け)
    rpc ListUaslVoxelsInView(ListUaslVoxelsInViewRequest) returns (ListUaslVoxelsInViewResponse);
}

// 航路ピクセル取得リクエスト
message ListUaslPixelsInViewRequest {
    // 取得する航路ピクセルの最大数 (初期値 = 0)。0 の場合はサーバー側の設定値が代入されます。
    int32 page_size = 1;
    // 前回のリクエストで返されたページトークン。初回は指定しない。
    string page_token = 2;
    // View の範囲
    UaslViewRange view_range = 3;
}

// 航路ピクセル取得レスポンス
message ListUaslPixelsInViewResponse {
    // 次の項目へのページトークン。全て読み切った場合は nil が返る。
    string next_page_token = 1;
    // 航路
    repeated PixelBasedUasl uasls = 2;
}

// 航路ボクセル取得リクエスト
message ListUaslVoxelsInViewRequest {
    // 取得する航路ボクセルの最大数 (初期値 = 0)。0 の場合はサーバー側の設定値が代入されます。
    int32 page_size = 1;
    // 前回のリクエストで返されたページトークン。初回は指定しない。
    string page_token = 2;
    // View の範囲
    UaslViewRange view_range = 3;
}

// 航路ボクセル取得レスポンス
message ListUaslVoxelsInViewResponse {
    // 次の項目へのページトークン。全て読み切った場合は nil が返る。
    string next_page_token = 1;
    // 航路
    repeated VoxelBasedUasl uasls = 2;
}

// ピクセル表現の航路
message PixelBasedUasl {
    // 航路 ID
    UaslId uasl_id = 1;
    // 航路ピクセルのリスト
    repeated UaslPixel uasl_pixels = 2;
}

// 航路 ID
message UaslId {
    // オブジェクト ID
    int64 object_id = 1;
    // 名前
    string name = 2;
    // オブジェクトの表示範囲
    UaslVisibility visibility = 3;

    // 表示範囲の種別
    enum UaslVisibility {
        // 未指定
        UNSPECIFIED = 0;
        // 公開
        PUBLIC = 1;
        // プライベート
        PRIVATE = 2;
    }
}

// 地図上の位置情報
message UaslLocation {
    // 緯度 [˚]
    double latitude = 1;
    // 経度 [˚]
    double longitude = 2;
}

// 航路ピクセル
message UaslPixel {
    // 空間 ID (f = 0 になる以外は UaslVoxel と同じ)
    UaslSpatialId spatial_id = 1;
}

// 航路サービスの空間 ID (z/f/x/y)
// ズームレベル 31 (2^31 - 1) まで対応できる
// 言語の互換性や誤って負の値が渡された場合を考慮して符号付き整数型を採用する
message UaslSpatialId {
    // ズームレベル (サイズを縮小したい場合は byte の利用を検討する)
    int32 z = 1;
    // f インデックス
    int32 f = 2;
    // x インデックス
    int32 x = 3;
    // y インデックス
    int32 y = 4;
}

// View の範囲
// ユーザーは対角線の端点によって View の範囲 (長方形) を指定できる
message UaslViewRange {
    // View の始点
    UaslLocation start = 1;
    // View の終点
    UaslLocation end = 2;
}

// 航路ボクセル
message UaslVoxel {
    // 空間 ID
    UaslSpatialId spatial_id = 1;
}

// ボクセル表現の航路
message VoxelBasedUasl {
    // 航路 ID
    UaslId uasl_id = 1;
    // 航路ボクセルのリスト
    repeated UaslVoxel uasl_voxels = 2;
}
