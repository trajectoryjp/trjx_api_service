// 路システムのUASLに空間情報を割り当てるリクエスト
message AssignUASLRequest {
    // UASL ID
    UASLID uasl_id = 1;
    // 組織ID
    int32 organization_id = 2;
}

// 路システムのUASLに空間情報を割り当てた結果
message AssignUASLResponse {
    // 割り当て結果
    bool result = 1;
    // UASL ID
    UASLID uasl_id = 2;
    // エラーメッセージ
    string message = 3;
}

// UASL情報をオブジェクトから削除するリクエスト
message DeleteUASLRequest {
    // UASL ID
    UASLID uasl_id = 1;
}

// UASL情報をオブジェクトから削除するレスポンス
message DeleteUASLResponse {
    // 削除結果
    bool result = 1;
    // エラーメッセージ
    string message = 2;
}

// 航路システムのUASLを識別するID
message UASLID {
    // 航路システムで管理されているUASL ID(airway ID)
    string uasl_systems_uasl_id = 2;
    // UASLシステムID TODO: 将来機能拡張対応。2025年度はUASLシステムIDに対応する接続先を設定ファイルにもつ。将来は外部向けDirectoryServerから動的取得する。リクエストかmetaデータどちらが良いかは検討
    int64 uasl_system_id = 3;
}