    // TODO: aiway_agent/protocol/v1/airway_agent.proto からの切り替えができるタイミングで以下を実装する
    // // [254_2 UASL利用BE 3.2UASL策定]
    // // 指定されたウェイポイント配列からUASLシステムにUASLを登録する
    // // 1) ウェイポイントから空間断面に変換する
    // // 2) UASL断面情報を登録する
